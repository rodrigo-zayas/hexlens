name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: swift test
      - name: Compilar app
        run: ./scripts/build-app.sh
