name: Release

# Cada push a main calcula la versión con conventional commits y, si hay feat/fix/breaking,
# compila HexLens en macOS, lo firma con Developer ID, lo notariza y publica una GitHub Release.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # Los forks no publican releases: no tienen los secretos de firma.
    if: github.repository == 'rodrigo-zayas/hexlens'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        run: |
          version=$(scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Siguiente versión: ${version:-ninguna}" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-latest
    # Los secretos de firma viven en el environment "release", que solo admite la rama main.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: swift test
      - name: Importar certificado Developer ID
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          base64 --decode <<<"$P12_BASE64" > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [[ -n "$identity" ]] || { echo "No hay identidad Developer ID Application en el certificado"; exit 1; }
          echo "HEXLENS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Compilar y firmar
        run: HEXLENS_VERSION="$VERSION" HEXLENS_BUILD="$GITHUB_RUN_NUMBER" ./scripts/build-app.sh
      - name: Notarizar
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          ./scripts/notarize.sh
          rm "$APPLE_API_KEY_PATH"
      - name: Comprobar Gatekeeper
        run: spctl --assess --type execute -vv dist/HexLens.app
      - name: Empaquetar
        run: |
          ditto -c -k --keepParent dist/HexLens.app "HexLens-$VERSION-macos-arm64.zip"
          tar -czf "hexlens-cli-$VERSION-macos-arm64.tar.gz" -C dist hexlens
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "HexLens-$VERSION-macos-arm64.zip" \
            "hexlens-cli-$VERSION-macos-arm64.tar.gz"
